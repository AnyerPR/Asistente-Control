    <script>
      // Guard for iframe/browser environments where window.fetch has only a getter and no setter
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc || !desc.set || !desc.writable) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _origFetch;
              },
              set: function(fn) {
                _origFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Fetch getter/setter guard initialized with fallback:', e);
        }
      })();
    </script>

  </body>
